name: Build Alpendos AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -q AlpendosAI_v0.1_build_hazir.zip

      - name: Build APK
        run: cd AlpendosAI && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AlpendosAI-APK
          path: AlpendosAI/app/build/outputs/apk/debug/app-debug.apk
